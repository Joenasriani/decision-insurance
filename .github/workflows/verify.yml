name: Verify Decision Insurance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  evidence_instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit generated dependency lockfile on authorized audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/phase0-pass03-evidence-guards' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git cat-file -e "origin/${{ github.head_ref }}:package-lock.json" 2>/dev/null; then
            echo "Lockfile already tracked; no bootstrap commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: freeze npm dependency resolution for audit branch"
          git push origin "HEAD:refs/heads/audit/phase0-pass03-evidence-guards"
      - name: Record resolved dependency versions
        run: npm ls --depth=0
      - name: Audit dependency advisories (diagnostic, non-gating)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,via:v.via.map(x=>typeof x==="string"?x:x.url||x.name),fixAvailable:v.fixAvailable}))},null,2))'
      - name: Upload private dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: |
            npm-audit.json
            package-lock.json
          retention-days: 7
      - run: node --test tests/*.cjs
      - run: npm run typecheck
      - run: npm run build
