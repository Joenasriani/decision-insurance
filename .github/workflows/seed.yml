name: Seed Decision Insurance

on:
  push:
    paths:
      - bootstrap/ready

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct prepared revision
        shell: bash
        run: |
          cat bootstrap/seed.* > /tmp/decision_insurance_seed.b64
          base64 --decode /tmp/decision_insurance_seed.b64 > /tmp/decision_insurance_seed.tar.gz
          tar -xzf /tmp/decision_insurance_seed.tar.gz -C .
          rm -f bootstrap/seed.*

      - name: Commit prepared revision
        shell: bash
        run: |
          git config user.name "Decision Insurance Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Decision Insurance evidence instrument"
          git push
