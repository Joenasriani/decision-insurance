name: Apply Decision Insurance Patch

on:
  push:
    paths:
      - patch/ready

permissions:
  contents: write

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact prepared patch
        shell: bash
        run: |
          cat patch/seed.* > /tmp/decision_insurance_patch.b64
          base64 --decode /tmp/decision_insurance_patch.b64 > /tmp/decision_insurance_patch.tar.gz
          tar -xzf /tmp/decision_insurance_patch.tar.gz -C .
          rm -f patch/seed.*
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Decision Insurance Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden source retrieval and claim challenge"
          git push
